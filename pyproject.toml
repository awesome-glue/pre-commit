# ============================================================================
# Build System & Package Metadata (PEP 517 / PEP 621 / PEP 735)
# ============================================================================

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[project]
name = "gtk-pre-commit"
version = "0.0.0"
description = "Pre-commit hooks for the Awesome Glue ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HH-MWB", email = "h.hong@mail.com" }]
keywords = [
    "aws",
    "aws-glue",
    "data-engineering",
    "dataops",
    "etl",
    "glue",
    "pre-commit",
    "pre-commit-hooks",
    "pyspark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tomlkit>=0.15.1",
]

[project.urls]
Repository = "https://github.com/awesome-glue/pre-commit"
Issues = "https://github.com/awesome-glue/pre-commit/issues"
Changelog = "https://github.com/awesome-glue/pre-commit/releases"

[project.scripts]
gtk-check-build = "gtk_pre_commit.check_build:main"
gtk-sort-deps = "gtk_pre_commit.sort_deps:main"

[dependency-groups]
dev = [
    { include-group = "test" },
    "pre-commit>=4.2.0",
]
test = [
    "behave>=1.2.6",
    "coverage>=7.6.0",
]

# ============================================================================
# Linting & Formatting
# ============================================================================

[tool.ruff]
line-length = 79
target-version = "py311"
fix = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # No per-file copyright headers in this project
    "D203",    # Incompatible with D211 (no-blank-line-before-class)
    "D213",    # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["gtk_pre_commit"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"features/**" = [
    "S101",  # assert statements in behave steps
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-statements = 10

# ============================================================================
# Type Checking
# ============================================================================

[tool.mypy]
strict = true
extra_checks = true
local_partial_types = true

# Stricter checks beyond default strict mode
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

# Extended error codes
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-function",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

# Output formatting
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

include = ["src"]
exclude = ["features"]

typeCheckingMode = "strict"
deprecateTypingAliases = true

# Diagnostic rules elevated to error beyond strict mode
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"

# ============================================================================
# Security Analysis
# ============================================================================

[tool.bandit]
exclude_dirs = ["features"]

[tool.bandit.try_except_pass]
check_typed_exception = true

# ============================================================================
# Spelling & Quality
# ============================================================================

[tool.codespell]
check-filenames = true
check-hidden = true

# ============================================================================
# Testing & Coverage
# ============================================================================

[tool.behave]
show_snippets = false
show_skipped = false

[tool.coverage.run]
source = ["gtk_pre_commit"]
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
