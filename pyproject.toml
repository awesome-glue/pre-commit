[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "gtk-pre-commit"
version = "0.0.0"
description = "Pre-commit hooks for AWS Glue Toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HH-MWB", email = "h.hong@mail.com" }]
keywords = [
    "aws",
    "glue",
    "pre-commit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0.2",
]

[project.urls]
Repository = "https://github.com/awesome-glue/pre-commit"
Issues = "https://github.com/awesome-glue/pre-commit/issues"
Changelog = "https://github.com/awesome-glue/pre-commit/releases"

[project.scripts]
gtk-noop = "gtk_pre_commit.noop:main"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]

[tool.bandit.try_except_pass]
check_typed_exception = true

[tool.coverage.run]
source = ["gtk_pre_commit"]

[tool.coverage.report]
fail_under = 100

[tool.mypy]
strict = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
fix = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # No per-file copyright headers in this project
    "D203",    # Incompatible with D211 (no-blank-line-before-class)
    "D213",    # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # pytest assert statements
]

[tool.ruff.lint.pylint]
max-statements = 10
